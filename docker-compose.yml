services:
  memory-agent:
    build: .
    container_name: memory-agent
    restart: unless-stopped
    ports:
      - "8086:8000"
    env_file:
      - .env
    environment:
      # HA连接
      HASS_SERVER: "${HASS_SERVER:-http://192.168.2.200:8123}"
      HASS_TOKEN: "${HASS_TOKEN:-}"
      # NR连接
      NR_URL: "${NR_URL:-http://192.168.2.200:1990}"
      NR_USER: "${NR_USER:-lidicn}"
      NR_PASS: "${NR_PASS:-}"
      # Redis
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      # Chroma
      CHROMA_HOST: "${CHROMA_HOST:-chroma}"
      CHROMA_PORT: "${CHROMA_PORT:-8000}"
      # LLM (OpenAI兼容)
      LLM_API_URL: "${LLM_API_URL:-https://api.deepseek.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      # HA MariaDB 直读（方案B 采集源，未启用时回退 REST）
      HA_DB_ENABLED: "${HA_DB_ENABLED:-false}"
      HA_DB_HOST: "${HA_DB_HOST:-192.168.2.200}"
      HA_DB_PORT: "${HA_DB_PORT:-3306}"
      HA_DB_NAME: "${HA_DB_NAME:-homeassistant}"
      HA_DB_USER: "${HA_DB_USER:-memory_agent_ro}"
      # 密码不在此处明文注入；以 config.json 的 ha_db_password 为准
      # JWT密钥
      JWT_SECRET: "${JWT_SECRET:-change_this_to_random_string}"
      PYTHONPATH: "/app/src"
    volumes:
      - ./src:/app/src
      - ./data:/data
      - ./.env:/app/.env:ro
    depends_on:
      - redis
      - chroma

  # Caddy 反向代理 + TLS 终止，用于 iOS/iPad PWA（HTTPS 必需）
  # 证书准备见 scripts/gen-certs.sh 或 Tailscale `tailscale cert`
  caddy:
    image: caddy:2-alpine
    container_name: memory-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    depends_on:
      - memory-agent

  redis:
    image: redis:alpine
    container_name: memory-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  chroma:
    image: docker.m.daocloud.io/chromadb/chroma:0.5.23
    container_name: memory-chroma
    restart: unless-stopped
    ports:
      - "8082:8000"
    volumes:
      - chroma_data:/data

volumes:
  redis_data:
  chroma_data:
  caddy_data:
