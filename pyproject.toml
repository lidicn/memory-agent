[project]
name = "memory-agent"
version = "1.0.0"
description = "Memory Agent - 家庭行为记忆中枢 MCP服务"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "python-dotenv>=1.0",
    "chromadb>=0.4.0",
    "redis>=5.0",
    "httpx>=0.27.0",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3.0",
    "itsdangerous>=2.0",
    "mcp>=2.0.0",
    "pymysql>=1.1",
    "paho-mqtt>=1.6",
]

[project.scripts]
memory-agent = "memory_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_agent"]
