# .github/workflows/ci.yml
# Memory Agent 持续集成：单元测试 + 语法检查
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout
          pip install -e .

      - name: Syntax check
        run: |
          python -m compileall src/ -q

      - name: Run unit tests
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_mqtt_bridge.py \
            --ignore=tests/test_ha_assist.py \
            --ignore=tests/test_quality_gates.py \
            --ignore=tests/test_vlm_gate.py \
            -x --timeout=60
        env:
          PYTHONPATH: src
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          MA_ENV: test
          GATES_DISABLE: "1"
