# 质量门禁 CI
#
# 两段分工：
#   AST/语法门禁 —— runner 自带解释器就够（compileall + pyflakes，不 import 被扫代码）。
#   import 冒烟  —— 必须在部署镜像里跑，否则第三方依赖没装齐会整片假红。
#
# 注：原 homesdk-gates AST 规则门禁因 homesdk 尚未发布到 GitHub 而暂时降级为
#     compileall 语法检查 + pyflakes。等 homesdk 发布后可恢复完整门禁。

name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SMOKE_TARGETS: memory_agent memory_agent.acp_server memory_agent.mcp_server

jobs:
  ast-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 基础语法检查：所有 .py 必须能编译
      - name: Syntax check (compileall)
        run: |
          python -m compileall src/ -q
          echo "语法检查通过"

      # pyflakes 门禁：基线只准减少（.gates/pyflakes-baseline.txt 为欠账台账）
      - name: Install pyflakes
        run: pip install pyflakes

      - name: pyflakes gate (baseline ratchet)
        run: bash scripts/pyflakes_gate.sh

  smoke-gates:
    # 冒烟在镜像里跑：装齐依赖之后，这条红才配当结论。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gates-smoke:${{ github.sha }} .

      - name: import smoke inside image
        run: |
          set -e
          for mod in $SMOKE_TARGETS; do
            echo "── import $mod"
            docker run --rm --entrypoint python gates-smoke:${{ github.sha }} -c "import $mod"
          done
